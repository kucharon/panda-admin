<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>熊猫睡眠管理后台 · 内容配置管理（可交互原型）</title>
<style>
:root{
  --sidebar:#34475a; --sidebar-deep:#2c3e50; --sidebar-active:#3aa9a4;
  --accent:#0f9f9f; --accent-deep:#0e7f7f; --accent-soft:#e6f7f6;
  --link:#1677ff; --bg:#eef1f5; --card:#fff; --border:#e5e9ef; --border-light:#f0f2f5;
  --th:#ececf0; --text:#303844; --text2:#4a5563; --muted:#8a94a3; --muted2:#98a2b3;
  --green:#3fba83; --red:#ff4d4f; --orange:#fa8c16; --blue:#1677ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--link);text-decoration:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#ccd4de;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.topbar{height:56px;background:#fff;border-bottom:1px solid #e8ebf0;display:flex;align-items:center;position:relative;z-index:30;flex:none}
.brand{width:200px;flex:none;display:flex;align-items:center;gap:10px;padding-left:16px;font-size:14px;font-weight:600;color:#1f2d3d;letter-spacing:.2px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#1e2b4a;display:flex;align-items:center;justify-content:center;flex:none}
.crumb-wrap{display:flex;align-items:center;gap:14px}
.hamburger{color:#5b6675;display:flex;align-items:center}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.crumb b{color:#2b3441;font-weight:500}
.crumb .sep{color:#c4ccd6}
.top-right{margin-left:auto;padding-right:20px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text2)}
.avatar{width:28px;height:28px;border-radius:50%;background:#dff3f1;color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.caret{color:#98a2b3;font-size:10px}

/* ---------- 布局 ---------- */
.layout{display:flex;height:calc(100% - 56px);overflow:hidden}
.sidebar{width:200px;flex:none;background:var(--sidebar);padding:10px 0 24px;overflow-y:auto;overflow-x:hidden}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#4a5d70}
.menu-item{height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px;color:#c7d1dc;position:relative;cursor:pointer;user-select:none;white-space:nowrap}
.menu-item:hover{background:rgba(255,255,255,.04);color:#fff}
.menu-item.open{color:#fff}
.menu-item .m-ico{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;color:currentColor}
.menu-item .m-caret{margin-left:auto;font-size:10px;color:#9fb0c2;transition:transform .15s}
.menu-item.open .m-caret{transform:rotate(180deg)}
.menu-child.menu-parent{font-weight:500}
.menu-child.menu-parent:hover{background:rgba(255,255,255,.05)}
.menu-child.menu-parent .mc-arrow{margin-left:auto;margin-right:8px;font-size:10px;color:#9fb0c2;transition:transform .15s}
.menu-child.menu-parent.open .mc-arrow{transform:rotate(180deg)}
.menu-grandchild{height:34px;display:flex;align-items:center;gap:8px;padding:0 16px 0 58px;font-size:12px;color:#a9b8c8;cursor:pointer;white-space:nowrap;position:relative}
.menu-grandchild:hover{color:#fff;background:rgba(255,255,255,.05)}
.menu-grandchild.active{background:var(--sidebar-active);color:#fff;font-weight:600}
.menu-grandchild.active::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#79e0d6}
.menu-grandchild .mc-dot{width:4px;height:4px;border-radius:50%;background:#7b8fa3;flex:none}
.menu-grandchild.active .mc-dot{background:#79e0d6}
.menu-subhead{padding:7px 12px 4px 44px;font-size:11px;font-weight:600;color:#7f8c9b;letter-spacing:.4px}
.menu-child{height:38px;display:flex;align-items:center;gap:9px;padding:0 16px 0 40px;font-size:12.5px;color:#b4c1cf;cursor:pointer;white-space:nowrap;position:relative}
.menu-child:hover{color:#fff;background:rgba(255,255,255,.05)}
.menu-child.active{background:var(--sidebar-active);color:#fff;font-weight:600}
.menu-child .mc-ico{width:16px;height:16px;display:flex;align-items:center;justify-content:center;opacity:.9;flex:none}
.menu-child .mc-ico svg{width:16px;height:16px}
.menu-child.active::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#79e0d6}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tabbar{height:40px;background:#fff;border-bottom:1px solid #e8ebf0;display:flex;align-items:center;padding:0 16px;gap:8px;flex:none}
.tab{height:27px;background:#f0f3f7;color:#4a5563;border-radius:3px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--green);color:#fff}
.tab .x{opacity:.65;font-size:13px;line-height:1;padding:0 1px}
.tab .x:hover{opacity:1}
.content{flex:1;overflow:auto;padding:16px 20px 24px;position:relative}
.page{max-width:1600px}

/* ---------- 卡片/查询 ---------- */
.card{background:var(--card);border-radius:4px;box-shadow:0 1px 2px rgba(16,30,54,.04);margin-bottom:14px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--border-light);gap:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600;color:#26303d;display:flex;align-items:center;gap:9px}
.card-title .bar{width:3px;height:14px;background:var(--accent);border-radius:2px;display:inline-block;flex:none}
.card-title .card-sub{font-size:11.5px;color:var(--muted2);font-weight:400}
.card-body{padding:16px 20px}
.card-foot-note{font-size:11.5px;color:var(--muted2);padding:0 20px 14px;line-height:1.6}
.query-card{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(16,30,54,.04);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qf{flex:none}
.qf input,.qf select{width:100%}
.q-actions{margin-left:auto;display:flex;gap:10px}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 16px;border-radius:3px;border:1px solid #d9dfe7;background:#fff;color:var(--text2);font-size:12.5px;white-space:nowrap;transition:all .12s}
.btn:hover{border-color:#b9c6d6;color:#26303d}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.link{border:none;background:transparent;color:var(--link);padding:0 4px;height:auto}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ops{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ops a{font-size:12px}
.ops a.danger{color:var(--red)}
.ops a.muted{color:var(--muted)}

/* ---------- 表单控件 ---------- */
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{height:32px;border:1px solid #d9dfe7;border-radius:3px;background:#fff;padding:0 10px;font-size:12.5px;color:var(--text);outline:none;transition:border-color .12s,box-shadow .12s;width:100%}
textarea{height:auto;padding:8px 10px;line-height:1.6;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,159,159,.12)}
input::placeholder,textarea::placeholder{color:#b8c0cb}
input:disabled,select:disabled,textarea:disabled{background:#f5f6f8;color:#8a94a3;cursor:not-allowed}
input[type=radio],input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);margin:0 6px 0 0;vertical-align:-2px;cursor:pointer}
.radio-row{display:flex;align-items:center;gap:20px;min-height:32px;flex-wrap:wrap}
.radio-row label{display:inline-flex;align-items:center;cursor:pointer;font-size:12.5px}
.check-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.check-row label{display:inline-flex;align-items:center;cursor:pointer;font-size:12.5px}
.check-row label.disabled{color:#b8c0cb;cursor:not-allowed}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
table.grid th{background:var(--th);color:#2b3441;font-size:12px;font-weight:600;text-align:left;padding:10px 8px;border-bottom:1px solid #e3e7ed;white-space:nowrap}
table.grid td{padding:9px 8px;border-bottom:1px solid var(--border-light);font-size:12px;color:#3a4452;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid tbody tr:hover td{background:#f7fafc}
table.grid tbody tr.selected td{background:#f0faf9}
table.grid tbody tr.row-error td{background:#fff1f0}
.col-center{text-align:center}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px}
.pagination{display:flex;align-items:center;gap:10px;padding:12px 18px;font-size:12px;color:#5b6675}
.pagination .pager{margin-left:auto;display:flex;align-items:center;gap:6px}
.page-btn{min-width:28px;height:28px;padding:0 6px;border:1px solid #e1e6ee;border-radius:3px;background:#fff;color:#5b6675;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-size{height:28px;width:96px;border:1px solid #e1e6ee;border-radius:3px;padding:0 6px;font-size:12px;color:#5b6675;background:#fff}
.jump{display:flex;align-items:center;gap:6px}
.jump input{width:46px;height:28px;text-align:center}

/* ---------- 封面色块 / 标签 ---------- */
.thumb{width:34px;height:34px;border-radius:4px;position:relative;overflow:hidden;flex:none;border:1px solid rgba(20,30,45,.06);background:#f2f4f7}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .mini-badge{position:absolute;right:0;bottom:0;z-index:2;background:rgba(20,30,45,.62);color:#fff;font-size:9px;line-height:12px;padding:0 3px;border-radius:2px 0 0 0}
.thumb.empty{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--red);background:#fff1f0;border:1px dashed #ffb3b8;text-align:center;line-height:1.1}
.thumb.broken{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);background:#f2f4f7;border:1px dashed #d5dee8;text-align:center;line-height:1.1}
.cover-cell{display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;font-size:11.5px;line-height:1;white-space:nowrap;border:1px solid transparent}
.tag-green{background:#e9f8ef;color:#1a7f4b;border-color:#b7e4c9}
.tag-teal{background:var(--accent-soft);color:var(--accent-deep);border-color:#b5e3e0}
.tag-gray{background:#f2f4f7;color:#8a94a3;border-color:#e1e6ee}
.tag-orange{background:#fff4e6;color:#d46b08;border-color:#ffd8a8}
.tag-red{background:#fff1f0;color:#cf1322;border-color:#ffccc7}
.tag-blue{background:#eef4ff;color:#1d5bd6;border-color:#c6d8ff}
.tag-plus{display:inline-flex;align-items:center;height:18px;padding:0 5px;margin-left:4px;border-radius:3px;background:#f2f4f7;color:#5b6675;font-size:10.5px;border:1px solid #e5e9ef}
.status-on{color:var(--blue)}
.status-off{color:var(--red)}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.2px}
.rank.top1{background:#f3e3b8;color:#8a6116}
.rank.top2{background:#dbe2fb;color:#3b4f9e}
.rank.top3{background:#f8dfd3;color:#9e4b2a}
.rank.topn{background:#39405e;color:#fff}
.eff{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;font-size:11px}
.eff-on{background:#e9f8ef;color:#1a7f4b}
.eff-wait{background:#fff4e6;color:#d46b08}
.eff-end{background:#f2f4f7;color:#8a94a3}
.eff-off{background:#fff1f0;color:#cf1322}

/* ---------- 弹窗 ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,26,42,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;animation:fadeIn .15s ease}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:6px;box-shadow:0 16px 48px rgba(15,26,42,.24);width:760px;max-width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 80px);animation:slideUp .18s ease}
.modal.wide{width:1000px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--border-light);flex:none;background:#fff;border-radius:6px 6px 0 0}
.modal-title{font-size:15px;font-weight:600;color:#26303d;display:flex;align-items:center;gap:10px}
.modal-close{width:26px;height:26px;border:none;background:transparent;color:#98a2b3;font-size:18px;border-radius:3px;line-height:1}
.modal-close:hover{background:#f2f4f7;color:#4a5563}
.modal-body{padding:6px 24px 18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 22px;border-top:1px solid var(--border-light);background:#fcfdfe;flex:none;border-radius:0 0 6px 6px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 表单分区 ---------- */
.branch-tip{display:flex;gap:8px;align-items:flex-start;margin:0 22px 14px;padding:9px 12px;border-radius:8px;background:#eef7f6;border:1px solid #cfe8e5;color:#1f7a70;font-size:12px;line-height:1.55}
.branch-tip b{color:#0f6b62;font-weight:600;white-space:nowrap}
.form-section{padding:16px 0 6px;border-bottom:1px dashed #e8edf3}
.form-section:last-child{border-bottom:none;padding-bottom:2px}
.section-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:#26303d;margin-bottom:14px}
.section-head .sec-bar{width:3px;height:14px;background:var(--accent);border-radius:2px}
.section-head .sec-tip{font-size:11.5px;color:var(--muted2);font-weight:400}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 30px}
.fgrid.single-col{grid-template-columns:minmax(0,1fr)}
.fitem{min-width:0}
.fitem.full{grid-column:1/-1}
.fitem .label{font-size:12.5px;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.fitem .label .req{color:var(--red)}
.hint{font-size:11.5px;color:var(--muted2);margin-top:5px;line-height:1.55}
.err-msg{display:none;font-size:11.5px;color:var(--red);margin-top:4px}
.has-error .err-msg{display:block}
.has-error input,.has-error select,.has-error textarea,.has-error .up-box{border-color:var(--red)!important}
.counter{font-size:11px;color:var(--muted2);text-align:right;margin-top:3px}
.upload-box{display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px dashed #d5dee8;border-radius:6px;background:#fafcfe}
.up-preview{width:104px;height:104px;border-radius:6px;border:1px solid #e1e6ee;background:#f2f6fa;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;position:relative;color:#b8c0cb;font-size:11.5px;text-align:center;line-height:1.4}
.up-preview.tall{width:104px;height:132px}
.up-preview.ratio54{width:140px;height:112px}
.up-preview.cover34{width:96px;height:128px}
.cover-duo{display:flex;gap:4px;align-items:center}
.thumb.thumb34{width:28px;height:37px}
.thumb.thumb54{width:44px;height:35px}
.th-sub{display:block;font-size:9.5px;color:#8a94a3;font-weight:400;line-height:1.25;margin-top:1px}
.up-preview img,.up-preview video{width:100%;height:100%;object-fit:cover;display:block}
.up-preview .up-badge{position:absolute;left:0;right:0;bottom:0;background:rgba(16,26,42,.55);color:#fff;font-size:10px;padding:2px 4px;text-align:center;z-index:2}
.up-meta{flex:1;min-width:0;font-size:12px;color:var(--muted2);line-height:1.6}
.up-meta .up-actions{display:flex;gap:8px;margin-top:8px}
.up-meta .up-name{color:var(--text2);margin-top:6px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-table{width:100%;border-collapse:collapse;margin-top:6px}
.mini-table th{background:#f5f7fa;font-size:11.5px;color:#5b6675;font-weight:600;text-align:left;padding:6px 8px;border:1px solid #eaeef4}
.mini-table td{padding:5px 8px;border:1px solid #eaeef4;font-size:12px}
.icon-btn{width:24px;height:24px;border:1px solid #e1e6ee;border-radius:3px;background:#fff;color:#5b6675;display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-right:4px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.icon-btn[disabled]{color:#c9d1db;cursor:not-allowed}
.empty-tip{padding:18px;text-align:center;color:var(--muted2);font-size:12px;background:#fafcfe;border:1px dashed #d5dee8;border-radius:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:#f2f6f8;border:1px solid #dfe6ec;border-radius:3px;padding:3px 8px;font-size:12px;color:#3a4756}
.chip .x{color:#98a2b3;font-size:11px;cursor:pointer}
.chip .x:hover{color:var(--red)}

/* ---------- 榜单 ---------- */
.rank-layout{display:flex;gap:16px;align-items:flex-start}
.rank-main{flex:1;min-width:0}
.rank-side{width:392px;flex:none;position:sticky;top:0}
.rank-table td{padding:8px}
.rank-table .rank-id-input{width:120px}
.rank-table .rank-subtitle-input{width:190px}
.rank-row-error td{background:#fff8f8!important}
.rank-err{color:var(--red);font-size:11px;margin-top:3px;display:block}
.rank-content{display:flex;align-items:center;gap:8px;min-height:34px}
.rank-content .nm{font-size:12px;color:#2b3441;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-content .ty{font-size:10.5px;color:var(--muted2)}
.rank-empty{color:#c4ccd6;font-size:11.5px}
.preview-card{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(16,30,54,.04);overflow:hidden}
.preview-card .pc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-light)}
.pc-title{font-size:13.5px;font-weight:600;color:#26303d;display:flex;align-items:center;gap:8px}
.pc-title .bar{width:3px;height:13px;background:var(--accent);border-radius:2px}
.rp-tabs{display:flex;gap:6px;padding:10px 12px 0;border-bottom:1px solid var(--border-light)}
.rp-tab{padding:6px 14px;font-size:12px;color:#5b6675;border-radius:3px 3px 0 0;cursor:pointer;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--accent-deep);border-bottom-color:var(--accent);font-weight:600;background:var(--accent-soft)}
.rp-body{padding:12px}
.rp-page-label{font-size:11px;color:var(--muted2);margin-bottom:8px;display:flex;justify-content:space-between}
.rp-item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:4px}
.rp-item + .rp-item{border-top:1px dashed #eef1f5}
.rp-item .rank{min-width:44px}
.rp-item .info{flex:1;min-width:0}
.rp-item .info .nm{font-size:12px;color:#26303d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-item .info .sub{font-size:11px;color:var(--muted2);margin-top:1px}
.rp-item .play{width:22px;height:22px;border-radius:50%;border:1px solid #d9dfe7;color:#5b6675;display:flex;align-items:center;justify-content:center;font-size:9px;flex:none}
.rp-dots{display:flex;gap:6px;justify-content:center;padding:10px 0 4px}
.rp-dot{width:7px;height:7px;border-radius:50%;background:#d5dee8;cursor:pointer}
.rp-dot.active{background:var(--accent)}
.rp-placeholder{font-size:11.5px;color:var(--muted2);text-align:center;padding:14px 0}
.rp-empty{color:#c4ccd6;font-size:11.5px;padding:6px}

/* ---------- 搜索发现预览 ---------- */

        '<span class="m-ico">' + ICONS[item.icon] + '</span><span>' + item.label + '</span>' +
        '<span class="m-caret">▾</span></div>';
      if (item.open) {
        item.children.forEach(function (child) {
          if (child.children) {
            html += '<div class="menu-child menu-parent' + (child.open ? ' open' : '') + '" data-subgroup="' + child.key + '"><span class="mc-ico">' + ICONS[child.icon] + '</span>' + esc(child.label) + '<span class="mc-arrow">▾</span></div>';
            if (child.open) {
              child.children.forEach(function (grand) {
                const gActive = UI.active === grand.key ? ' active' : '';
                html += '<div class="menu-grandchild' + gActive + '" data-nav="' + grand.key + '"><span class="mc-dot"></span>' + grand.label + '</div>';
              });
            }
            return;
          }
          const active = UI.active === child.key ? ' active' : '';
          html += '<div class="menu-child' + active + '" data-nav="' + child.key + '"><span class="mc-ico">' + ICONS[child.icon] + '</span>' + child.label + '</div>';
        });
      }
    } else {

const UPLOAD_LIMIT = {
  c34: { imgMax: 2, gifMax: 5, videoMax: 20, ratio: 3 / 4, ratioLabel: '3:4' },
  c11: { imgMax: 2, gifMax: 5, videoMax: 20, ratio: 1, ratioLabel: '1:1' },

  legacyCover: { imgMax: 2, gifMax: 5 },
  chapterCover: { imgMax: 0.2 },
  chapterCover11: { imgMax: 2, gifMax: 5, ratio: 1, ratioLabel: '1:1' }
};
function fmtSize(b) { return b > 1024 * 1024 ? (b / 1024 / 1024).toFixed(1) + 'MB' : Math.round(b / 1024) + 'KB'; }
function checkRatio(w, h, limits) {
  if (!limits || !limits.ratio || !w || !h) return null;
  const actual = w / h;
  if (Math.abs(actual / limits.ratio - 1) > 0.03) {
    return '图片比例不符，需 ' + (limits.ratioLabel || '') + '（当前 ' + w + '×' + h + '）';
  }
  return null;
}
function readImageFile(file, maxMB, limits) {
  return new Promise(function (resolve, reject) {
    if (!/^image\//.test(file.type)) return reject('请选择图片文件（JPG / PNG / WebP / GIF）');
    if (limits && limits.types && limits.types.indexOf(file.type) < 0) return reject('仅支持 ' + (limits.typeLabel || '指定格式'));
    if (file.size > maxMB * 1024 * 1024) return reject('图片超过 ' + maxMB + 'MB 上限（当前 ' + fmtSize(file.size) + '）');
    const img = new Image();
    img.onload = function () {
      const ratioErr = checkRatio(img.naturalWidth, img.naturalHeight, limits);
      if (ratioErr) return reject(ratioErr);
      const reader = new FileReader();
      reader.onload = function () { resolve({ src: reader.result, video: false, name: file.name, size: file.size }); };
      reader.onerror = function () { reject('图片读取失败'); };
      reader.readAsDataURL(file);
    };
    img.onerror = function () { reject('图片解析失败'); };
    img.src = URL.createObjectURL(file);
  });
}
function readVideoFile(file, maxMB, limits) {
  return new Promise(function (resolve, reject) {
    if (file.type !== 'video/mp4') return reject('视频仅支持 MP4');
    if (file.size > maxMB * 1024 * 1024) return reject('视频超过 ' + maxMB + 'MB 上限（当前 ' + fmtSize(file.size) + '）');
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = function () {
      if (v.duration && v.duration > 10.2) { URL.revokeObjectURL(url); return reject('视频时长需 ≤ 10 秒（当前 ' + v.duration.toFixed(1) + ' 秒）'); }
      const ratioErr = checkRatio(v.videoWidth, v.videoHeight, limits);
      if (ratioErr) { URL.revokeObjectURL(url); return reject(ratioErr); }
      resolve({ src: url, video: true, name: file.name, size: file.size });
    };
    v.onerror = function () { URL.revokeObjectURL(url); reject('视频读取失败'); };
    v.src = url;
  });
}
function handleUpload(file, limits) {
  if (!file) return Promise.reject('');
  const isGif = file.type === 'image/gif';
  if (file.type === 'video/mp4') return readVideoFile(file, limits.videoMax || 20, limits);
  if (isGif) return readImageFile(file, limits.gifMax || 5, limits);
  return readImageFile(file, limits.imgMax || 2, limits);
}

    toast('搜索词已保存');

function contentAddMode() { openContentModal(null, 'add'); }
function copyContent(id) {
  const src = CONTENT.find(function (c) { return c.id === id; });
  if (!src) return;
  const copy = deepCopyContent(src);
  copy.id = Math.max.apply(null, CONTENT.map(function (c) { return c.id; })) + 1;
  copy.name = src.name + '（副本）';
  CONTENT.unshift(copy);
  refreshContentTable();
  toast('已复制为内容 ID ' + copy.id);
}

document.addEventListener('click', function (e) {
  const closeBtn = e.target.closest('[data-act="modal-close"]');
  if (closeBtn) { closeModal(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }
  const subgroup = e.target.closest('[data-subgroup]');
  if (subgroup) {
    const parent = SIDE_MENU.find(function (m) { return m.children; }).children.find(function (c) { return c.key === subgroup.dataset.subgroup; });
    if (parent) { parent.open = !parent.open; renderSidebar(); }
    return;
  }
  const group = e.target.closest('[data-group]');
  if (group) {
    const item = SIDE_MENU.find(function (m) { return m.key === group.dataset.group; });
    if (item && item.children) { item.open = !item.open; renderSidebar(); }
    return;
  }
  const tabClose = e.target.closest('[data-tab-close]');
  if (tabClose) {
    e.stopPropagation();
    const key = tabClose.dataset.tabClose;
    UI.tabs = UI.tabs.filter(function (t) { return t.key !== key; });
    if (UI.active === key) {
      if (UI.tabs.length) UI.active = UI.tabs[UI.tabs.length - 1].key;
      else UI.active = null;
    }
    if (UI.active) navigate(UI.active);
    else { renderTabs(); renderBreadcrumb(); $('#content').innerHTML = '<div class="placeholder" style="margin-top:40px"><div class="ph-icon">▤</div><h3>没有打开的页签</h3><p>点击左侧「内容配置管理」下的二级页面重新打开。</p></div>'; }
    return;
  }
  const tabSwitch = e.target.closest('[data-tab-switch]');
  if (tabSwitch) { navigate(tabSwitch.dataset.tabSwitch); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id != null ? (isNaN(parseInt(el.dataset.id, 10)) ? el.dataset.id : parseInt(el.dataset.id, 10)) : null;
  switch (act) {
    case 'content-search': readFilterInputs(); refreshContentTable(); toast('筛选完成，共 ' + filterContent().length + ' 条', 'info'); break;
    case 'content-reset': UI.filter = { name: '', kind: '', legacyType: '', status: '' }; UI.chapterId = null; UI.featuredAudioId = null; navigate('content'); toast('筛选条件已重置', 'info'); break;
    case 'content-add': contentAddMode(); break;
    case 'fa-back': UI.featuredAudioId = null; renderPage(); break;
    case 'fa-add': openFeaturedAudioModal(); break;
    case 'fa-audio-save': saveFeaturedAudioModal(); break;
    case 'fa-save': if (validateFeaturedAudio(true)) { toast('精选白噪音音频已保存'); } break;
    case 'fa-up': moveFeaturedAudio(parseInt(el.dataset.i, 10), -1); break;
    case 'fa-down': moveFeaturedAudio(parseInt(el.dataset.i, 10), 1); break;
    case 'fa-del': { const it = currentFeaturedAudio(); if (it) { it.refTracks.splice(parseInt(el.dataset.i, 10), 1); UI.faErrors = []; refreshFeaturedAudioPage(); } break; }
    case 'content-refresh': refreshContentTable(); toast('列表已刷新', 'info'); break;
    case 'edit': openContentModal(id, 'edit'); break;
    case 'view': { const it = CONTENT.find(function (c) { return c.id === id; }); if (it && it.kind === 'series') { UI.chapterId = id; renderPage(); } else if (it && it.legacyType === '白噪音' && it.topFeatured) { UI.featuredAudioId = id; renderPage(); } else { openContentModal(id, 'view'); } break; }
    case 'chapter-back': UI.chapterId = null; renderPage(); break;
    case 'chapter-add': openChapterModal(UI.chapterId, null); break;
    case 'chapter-edit': openChapterModal(UI.chapterId, parseInt(el.dataset.i, 10)); break;
    case 'chapter-del': { const se = currentSeries(); if (se) { se.chapters.splice(parseInt(el.dataset.i, 10), 1); toast('小课已删除'); renderPage(); } break; }
    case 'chapter-save': collectAndSaveChapter(); break;
    case 'chapter-pick-audio': { const inp = $('#up-chapter-audio-input'); if (inp) inp.click(); break; }
    case 'copy': copyContent(id); break;
    case 'content-save': collectAndSaveContent(); break;
    case 'pick-upload': { const input = $('#up-' + el.dataset.target + '-input'); if (input) input.click(); break; }
    case 'clear-upload': { if (UI.modal) { UI.modal['upload_' + el.dataset.target] = null; renderUploadPreview(el.dataset.target); const n = $('#up-' + el.dataset.target + '-name'); if (n) n.textContent = ''; updateContentPreviews(); } break; }
    case 'pick-audio': { const inp = $('#up-audio-input'); if (inp) inp.click(); break; }
    case 'series-add': { const its = UI.modal.data.seriesItems || (UI.modal.data.seriesItems = []); its.push({ source: 'upload', audio: '', contentId: '', name: '', duration: '', trial: '', cover11: null }); UI.modal.seriesErrors = []; renderSeriesRows(); break; }
    case 'series-del': { UI.modal.data.seriesItems.splice(parseInt(el.dataset.i, 10), 1); UI.modal.seriesErrors = []; renderSeriesRows(); break; }
    case 'series-up': { const i = parseInt(el.dataset.i, 10); const its = UI.modal.data.seriesItems; if (i > 0) { const t = its[i - 1]; its[i - 1] = its[i]; its[i] = t; renderSeriesRows(); } break; }
    case 'series-down': { const i = parseInt(el.dataset.i, 10); const its = UI.modal.data.seriesItems; if (i < its.length - 1) { const t = its[i + 1]; its[i + 1] = its[i]; its[i] = t; renderSeriesRows(); } break; }
    case 'series-pick-cover': { const inp = document.querySelector('[data-series-file="' + el.dataset.i + '"][data-ck="' + el.dataset.ck + '"]'); if (inp) inp.click(); break; }
    case 'rank-tab': UI.rankPreview.tab = el.dataset.tab; refreshRankPreview(); break;
    case 'rank-page': UI.rankPreview.page = parseInt(el.dataset.page, 10); refreshRankPreview(); break;
    case 'rank-clear': { rankDraft[parseInt(el.dataset.pos, 10) - 1] = { id: '', subtitle: '' }; rankError[parseInt(el.dataset.pos, 10) - 1] = null; refreshRankRow(parseInt(el.dataset.pos, 10)); refreshRankPreview(); break; }
    case 'rank-save': validateAndSaveRank(); break;
    case 'search-add': openSearchModal(null); break;
    case 'search-edit': openSearchModal(id); break;
    case 'search-toggle': { const s = SEARCH.find(function (x) { return x.id === id; }); if (s) { s.status = s.status === 'on' ? 'off' : 'on'; refreshSearchPage(); toast('「' + s.word + '」已' + (s.status === 'on' ? '启用' : '禁用')); } break; }
    case 'search-del': { SEARCH = SEARCH.filter(function (x) { return x.id !== id; }); refreshSearchPage(); toast('搜索词已删除'); break; }
    case 'search-save': saveSearch(); break;
    case 'search-chip': toast('执行搜索：' + el.dataset.word, 'info'); break;
  }
});
document.addEventListener('input', function (e) {
  const t = e.target;
  if (t.dataset && t.dataset.ref != null) {
    const i = parseInt(t.dataset.ref, 10);
    if (UI.modal && UI.modal.data && UI.modal.data.refTracks && UI.modal.data.refTracks[i]) {
      const it = UI.modal.data.refTracks[i];
      it.contentId = t.value;
      const c = findContent(t.value);
      it.name = c ? c.name : '';
      it.duration = c ? (c.audioDuration || '') : '';
      const row = t.closest('tr');
      if (row) {
        const n = row.querySelector('.ref-name-input'); if (n) n.value = it.name;
        const d = row.querySelector('.ref-dur-input'); if (d) d.value = it.duration;
      }
    }
    return;
  }
  if (t.id && /^rank-(id|subtitle)-/.test(t.id)) {
    const pos = parseInt(t.dataset.rankPos, 10);
    const k = t.dataset.rankK;
    rankDraft[pos - 1][k] = t.value;
    rankError[pos - 1] = null;
    refreshRankRow(pos);
    refreshRankPreview();
    return;
  }
  if (t.dataset && t.dataset.series != null) {
    const i = parseInt(t.dataset.series, 10);
    const k = t.dataset.k;
    if (UI.modal && UI.modal.data && UI.modal.data.seriesItems && UI.modal.data.seriesItems[i]) {
      const it = UI.modal.data.seriesItems[i];
      it[k] = t.value;
      if (k === 'contentId') {
        const c = findContent(t.value);
        const row = t.closest('tr');
        if (c && row) {
          if (!it.name) { it.name = c.name; const n = row.querySelector('[data-k="name"]'); if (n) n.value = it.name; }
          if (!it.duration) { it.duration = c.audioDuration || ''; const d = row.querySelector('[data-k="duration"]'); if (d) d.value = it.duration; }
        }
        const hint = document.getElementById('series-lookup-' + i);
        if (hint) hint.innerHTML = seriesLookupText(it);
      }
    }
    return;
  }
  if (t.id === 'm-intro-body') {
    const c = document.getElementById('m-body-count');
    if (c) c.textContent = t.value.replace(/\s/g, '').length;
  }
});
document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.dataset && t.dataset.seriesFile != null) {
    const i = parseInt(t.dataset.seriesFile, 10);
    const ck = t.dataset.ck;
    const f = t.files && t.files[0];
    t.value = '';
    if (f && UI.modal && UI.modal.data.seriesItems && UI.modal.data.seriesItems[i]) {
      handleUpload(f, { imgMax: 2, gifMax: 5, videoMax: 20, ratio: 1, ratioLabel: '1:1' }).then(function (res) {
        UI.modal.data.seriesItems[i][ck] = res;
        renderSeriesRows();
        toast('音频卡片封面已上传', 'info');
      }).catch(function (err) {
        if (err) toast(err, 'error');
      });
    }
    return;
  }
  if (t.dataset && t.dataset.seriesSource != null) {
    const i = parseInt(t.dataset.seriesSource, 10);
    if (UI.modal && UI.modal.data && UI.modal.data.seriesItems[i]) {
      const it = UI.modal.data.seriesItems[i];
      it.source = t.value;
      if (it.source === 'contentId' && it.contentId) {
        const c = findContent(it.contentId);
        if (c) { if (!it.name) it.name = c.name; if (!it.duration) it.duration = c.audioDuration || ''; }
      }
      UI.modal.seriesErrors = [];
      setTimeout(renderSeriesRows, 0);
    }
    return;
  }
  if (t.dataset && t.dataset.series != null && t.dataset.k === 'contentId') {
    const i = parseInt(t.dataset.series, 10);
    if (UI.modal && UI.modal.data && UI.modal.data.seriesItems[i]) {
      const it = UI.modal.data.seriesItems[i];
      const c = findContent(it.contentId);
      if (c) { if (!it.name) it.name = c.name; if (!it.duration) it.duration = c.audioDuration || ''; }
      setTimeout(renderSeriesRows, 0);
    }
    return;
  }
  if (t.closest && t.closest('#modal')) updateContentPreviews();
});
document.addEventListener('dblclick', function (e) {
  const row = e.target.closest('#contentTbody tr[data-row-id]');
  if (row) {
    const id = parseInt(row.dataset.rowId, 10);
    const it = CONTENT.find(function (c) { return c.id === id; });
    if (it && it.kind === 'series') { UI.chapterId = id; renderPage(); } else openContentModal(id, 'edit');
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('#modalOverlay').classList.contains('hidden')) closeModal();
});
$('#modalOverlay').addEventListener('click', function (e) {
  if (e.target === $('#modalOverlay')) closeModal();
});

/* =========================================================
   初始化
   ========================================================= */
window.__PROTO__ = {
  UI: UI,
  get content() { return CONTENT; },
  get search() { return SEARCH; },
  get ranking() { return RANKING; },
  navigate: navigate,
  openContentModal: openContentModal,
  openSearchModal: openSearchModal,

};
renderSidebar();
renderTabs();
renderBreadcrumb();
UI.active = 'content';
renderPage();
})();
</script>
</body>
</html>
